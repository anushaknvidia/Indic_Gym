config_paths:
  - resources_servers/indic_ifbench/configs/indic_ifbench.yaml

indic_ifbench_benchmark_simple_agent:
  _inherit_from: indic_ifbench_simple_agent
  responses_api_agents:
    simple_agent:
      datasets:
      - name: indic_ifbench
        type: benchmark
        jsonl_fpath: benchmarks/indic/ifbench/data/indic_ifbench_benchmark.jsonl
        prompt_config: benchmarks/indic/ifbench/prompts/default.yaml
        prepare_script: benchmarks/indic/ifbench/prepare.py
        num_repeats: 5

indic_ifbench_benchmark_environment_server:
  _inherit_from: indic_ifbench_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: indic_ifbench_benchmark_simple_agent
