biggenbench:
  resources_servers:
    biggenbench:
      entrypoint: app.py
      domain: other
      verified: false
      description: Indic BiGGen Bench with task-specific absolute rubric scores from 1 to 5.
      value: Evaluate generation capabilities across Indic languages using the original task rubrics and references.
      judge_model_server:
        type: responses_api_models
        name: judge_model
      judge_chat_completions_create_params:
        messages: []
        temperature: 0.0
        max_tokens: 16384
        reasoning_effort: low

judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${judge_base_url}
      openai_api_key: ${judge_api_key}
      openai_model: ${judge_model_name}
      max_concurrent_requests: 8

biggenbench_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: biggenbench
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/biggenbench/data/example.jsonl
        license: CC BY-SA 4.0

biggenbench_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: biggenbench_simple_agent

# Supply judge credentials through launch-time Hydra configuration.
judge_base_url: null
judge_api_key: null
judge_model_name: null
