indic_ifbench:
  resources_servers:
    indic_ifbench:
      entrypoint: app.py
      domain: instruction_following
      verified: false
      description: Indic IFBench with deterministic Unicode-aware checks for twelve languages
      value: Evaluate translated instruction constraints with language-specific rules

indic_ifbench_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: indic_ifbench
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/indic_ifbench/data/example.jsonl

indic_ifbench_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: indic_ifbench_simple_agent
